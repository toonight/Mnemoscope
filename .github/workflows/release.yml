name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      # Node 24 bundles npm >= 11.5.1, which is the minimum for OIDC trusted
      # publishing. Avoids the `npm install -g npm@latest` upgrade-in-place
      # path that hits MODULE_NOT_FOUND on the GitHub-hosted toolcache.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test
      - run: npm audit --audit-level=moderate
      # Publishing uses npm OIDC trusted publishing (no NPM_TOKEN). A trusted
      # publisher is registered per-package on npmjs.com:
      #   org -> Trusted Publishers -> GitHub Actions -> toonight/Mnemoscope, workflow release.yml.
      # Each publish step is idempotent: if the version is already on the
      # registry (e.g. a previous run died mid-publish), the step skips
      # cleanly instead of failing with E409. This keeps `gh run rerun`
      # safe across partial failures.
      - name: Publish @mnemoscope/core
        env:
          PKG_VERSION: ${{ github.ref_name }}
        run: |
          v="$(node -p "require('./packages/core/package.json').version")"
          if npm view "@mnemoscope/core@${v}" version >/dev/null 2>&1; then
            echo "@mnemoscope/core@${v} already on the registry, skipping."
          else
            npm publish --workspace @mnemoscope/core --access public --provenance
          fi
      - name: Publish @mnemoscope/mcp-server
        run: |
          v="$(node -p "require('./packages/mcp-server/package.json').version")"
          if npm view "@mnemoscope/mcp-server@${v}" version >/dev/null 2>&1; then
            echo "@mnemoscope/mcp-server@${v} already on the registry, skipping."
          else
            npm publish --workspace @mnemoscope/mcp-server --access public --provenance
          fi
      - name: Publish @mnemoscope/cli
        run: |
          v="$(node -p "require('./packages/cli/package.json').version")"
          if npm view "@mnemoscope/cli@${v}" version >/dev/null 2>&1; then
            echo "@mnemoscope/cli@${v} already on the registry, skipping."
          else
            npm publish --workspace @mnemoscope/cli --access public --provenance
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$REF_NAME" \
            --title "$REF_NAME" \
            --notes "Published @mnemoscope/core, @mnemoscope/mcp-server, and @mnemoscope/cli at tag $REF_NAME. See CHANGELOG.md for details." \
            --verify-tag
