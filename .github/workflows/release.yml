name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      # Node 24 bundles npm >= 11.5.1, which is the minimum for OIDC trusted
      # publishing. Avoids the `npm install -g npm@latest` upgrade-in-place
      # path that hits MODULE_NOT_FOUND on the GitHub-hosted toolcache.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test
      - run: npm audit --audit-level=moderate
      # Publishing uses npm OIDC trusted publishing (no NPM_TOKEN). The trusted
      # publisher is configured on npmjs.com for the @mnemoscope scope:
      # org -> Trusted Publishers -> GitHub Actions -> toonight/Mnemoscope, workflow release.yml.
      - name: Publish @mnemoscope/core
        run: npm publish --workspace @mnemoscope/core --access public --provenance
      - name: Publish @mnemoscope/mcp-server
        run: npm publish --workspace @mnemoscope/mcp-server --access public --provenance
      - name: Publish @mnemoscope/cli
        run: npm publish --workspace @mnemoscope/cli --access public --provenance
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$REF_NAME" \
            --title "$REF_NAME" \
            --notes "Published @mnemoscope/core, @mnemoscope/mcp-server, and @mnemoscope/cli at tag $REF_NAME. See CHANGELOG.md for details." \
            --verify-tag
