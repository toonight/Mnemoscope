[project]
name = "mnemoscope-research"
version = "0.1.0"
description = "Mnemoscope research sub-project: predictive context-rot classifier, MarkdownMemBench, Chroma replication."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "scikit-learn>=1.5",
  "skl2onnx>=1.17",
  "onnxruntime>=1.20",
  "numpy>=2.0",
  "pandas>=2.2",
]

[tool.uv]
dev-dependencies = [
  "ruff>=0.7",
  "pytest>=8.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
