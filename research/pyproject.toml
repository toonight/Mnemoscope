[project]
name = "mnemoscope-research"
version = "0.1.0"
description = "Mnemoscope research sub-project: predictive context-rot classifier, MarkdownMemBench, Chroma replication."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "scikit-learn>=1.5",
  "skl2onnx>=1.17",
  "onnxruntime>=1.20",
  "numpy>=2.0",
  "pandas>=2.2",
]

[tool.uv]
dev-dependencies = [
  "ruff>=0.7",
  "pytest>=8.3",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: pytest fixtures often build objects in defaults intentionally.
# E501: line length is enforced by `line-length`, no need to double-flag.
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
