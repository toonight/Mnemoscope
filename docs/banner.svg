<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mnemoscope — See how your agent remembers (and forgets).">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a1a"/>
      <stop offset="100%" stop-color="#0e1530"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.5" r="0.4">
      <stop offset="0%" stop-color="#5fd9d1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5fd9d1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.55" r="0.5">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5fd9d1"/>
      <stop offset="55%" stop-color="#9be7e2"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#5fd9d1" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow1)"/>
  <rect width="1280" height="320" fill="url(#glow2)"/>

  <!-- The scope -->
  <g transform="translate(220, 160)" fill="none">
    <circle r="135" stroke="#5fd9d1" stroke-opacity="0.10" stroke-width="1"/>
    <circle r="105" stroke="#5fd9d1" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="2 6"/>
    <circle r="75"  stroke="#5fd9d1" stroke-opacity="0.30" stroke-width="1.2"/>
    <circle r="45"  stroke="#5fd9d1" stroke-opacity="0.50" stroke-width="1.5"/>
    <circle r="20"  stroke="#5fd9d1" stroke-opacity="0.85" stroke-width="2"/>
    <circle r="4"   fill="#5fd9d1"/>
    <line x1="-145" y1="0"   x2="-115" y2="0"   stroke="#5fd9d1" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="115"  y1="0"   x2="145"  y2="0"   stroke="#5fd9d1" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="0"    y1="-145" x2="0"   y2="-115" stroke="#5fd9d1" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="0"    y1="115"  x2="0"   y2="145"  stroke="#5fd9d1" stroke-opacity="0.4" stroke-width="1"/>
    <!-- ticks -->
    <g stroke="#5fd9d1" stroke-opacity="0.4" stroke-width="1">
      <line x1="80" y1="-46" x2="68" y2="-39"/>
      <line x1="-80" y1="46" x2="-68" y2="39"/>
      <line x1="80" y1="46" x2="68" y2="39"/>
      <line x1="-80" y1="-46" x2="-68" y2="-39"/>
    </g>
  </g>

  <!-- Floating memory tiles (Markdown notes) -->
  <g>
    <g transform="translate(60, 80)" opacity="0.7">
      <rect x="0" y="0" width="38" height="24" rx="3" fill="#1a2444" stroke="#a78bfa" stroke-width="1"/>
      <line x1="6" y1="8"  x2="24" y2="8"  stroke="#a78bfa" stroke-opacity="0.8" stroke-width="1"/>
      <line x1="6" y1="13" x2="30" y2="13" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1"/>
      <line x1="6" y1="18" x2="22" y2="18" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1"/>
    </g>
    <g transform="translate(110, 240)" opacity="0.55">
      <rect x="0" y="0" width="38" height="24" rx="3" fill="#1a2444" stroke="#a78bfa" stroke-width="1"/>
      <line x1="6" y1="8"  x2="26" y2="8"  stroke="#a78bfa" stroke-opacity="0.8" stroke-width="1"/>
      <line x1="6" y1="13" x2="32" y2="13" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1"/>
    </g>
    <g transform="translate(370, 60)" opacity="0.6">
      <rect x="0" y="0" width="38" height="24" rx="3" fill="#1a2444" stroke="#a78bfa" stroke-width="1"/>
      <line x1="6" y1="8"  x2="24" y2="8"  stroke="#a78bfa" stroke-opacity="0.8" stroke-width="1"/>
      <line x1="6" y1="13" x2="30" y2="13" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1"/>
      <line x1="6" y1="18" x2="22" y2="18" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1"/>
    </g>
    <g transform="translate(395, 245)" opacity="0.45">
      <rect x="0" y="0" width="38" height="24" rx="3" fill="#1a2444" stroke="#a78bfa" stroke-width="1"/>
      <line x1="6" y1="8"  x2="22" y2="8"  stroke="#a78bfa" stroke-opacity="0.8" stroke-width="1"/>
      <line x1="6" y1="13" x2="28" y2="13" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1"/>
    </g>
  </g>

  <!-- Title -->
  <text x="490" y="170" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="80" font-weight="800" fill="url(#title)" letter-spacing="-2.5">Mnemoscope</text>

  <!-- Tagline -->
  <text x="494" y="212" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#cbd5e1">See how your agent remembers <tspan fill="#94a3b8" font-style="italic">(and forgets).</tspan></text>

  <!-- Tech hint -->
  <text x="494" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="400" fill="#5fd9d1" opacity="0.85">predict · witness · tier  ·  MCP server + Obsidian plugin  ·  100% local  ·  Apache-2.0</text>

  <!-- Status indicators -->
  <g transform="translate(494, 268)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500">
    <g>
      <circle cx="5" cy="6" r="3" fill="#7cf09d"/>
      <text x="14" y="10" fill="#7cf09d" opacity="0.9">predictive</text>
    </g>
    <g transform="translate(96, 0)">
      <circle cx="5" cy="6" r="3" fill="#a78bfa"/>
      <text x="14" y="10" fill="#a78bfa" opacity="0.9">audited</text>
    </g>
    <g transform="translate(176, 0)">
      <circle cx="5" cy="6" r="3" fill="#5fd9d1"/>
      <text x="14" y="10" fill="#5fd9d1" opacity="0.9">tiered</text>
    </g>
    <g transform="translate(246, 0)">
      <circle cx="5" cy="6" r="3" fill="#fbbf24"/>
      <text x="14" y="10" fill="#fbbf24" opacity="0.9">open-source</text>
    </g>
  </g>
</svg>
